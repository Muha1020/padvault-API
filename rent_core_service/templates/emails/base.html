<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padvault</title>
    <!--[if mso]>
    <noscript>
    <xml>
    <o:OfficeDocumentSettings>
        <o:PixelsPerInch>96</o:PixelsPerInch>
    </o:OfficeDocumentSettings>
    </xml>
    </noscript>
    <![endif]-->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            width: 100% !important;
            -webkit-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            line-height: 1.6;
        }
        .email-wrapper {
            width: 100%;
            background-color: #f8fafc;
            padding: 40px 10px;
        }
        .email-container {
            max-width: 580px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 40px -10px rgba(15, 23, 42, 0.05);
            border: 1px solid #e2e8f0;
        }
        .email-header {
            background-color: #0f2347;
            padding: 40px 30px;
            text-align: center;
        }
        .email-body {
            padding: 48px 40px;
        }
        .email-footer {
            background-color: #ffffff;
            padding: 32px 40px;
            text-align: center;
            border-top: 1px solid #f1f5f9;
        }
        .motto {
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: #94a3b8;
            margin-bottom: 24px;
        }
        .footer-text {
            font-size: 12px;
            color: #64748b;
            margin: 4px 0;
        }
        .h1 {
            font-size: 28px;
            font-weight: 800;
            line-height: 1.2;
            letter-spacing: -0.02em;
            color: #0f172a;
            margin-bottom: 20px;
        }
        .p {
            font-size: 15px;
            color: #475569;
            margin-bottom: 24px;
        }
        .btn-container {
            padding: 10px 0 30px;
        }
        .btn {
            display: inline-block;
            background-color: #0f2347;
            color: #ffffff !important;
            text-decoration: none;
            padding: 18px 36px;
            border-radius: 99px;
            font-weight: 700;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            box-shadow: 0 10px 20px -5px rgba(15, 35, 71, 0.2);
        }
        .card {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
        }
        .card-row {
            margin-bottom: 12px;
            border-bottom: 1px solid #f1f5f9;
            padding-bottom: 12px;
        }
        .card-row:last-child {
            margin-bottom: 0;
            border-bottom: none;
            padding-bottom: 0;
        }
        .card-label {
            display: block;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #94a3b8;
            margin-bottom: 4px;
        }
        .card-value {
            display: block;
            font-size: 16px;
            font-weight: 700;
            color: #0f2347;
        }
        .otp-box {
            background-color: #0f2347;
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            margin: 32px 0;
        }
        .otp-code {
            font-size: 48px;
            font-weight: 900;
            letter-spacing: 16px;
            color: #f5a623;
            margin-left: 16px; /* Offset the tracking */
        }
        @media only screen and (max-width: 480px) {
            .email-body { padding: 32px 24px; }
            .h1 { font-size: 24px; }
        }
    </style>
</head>
<body>
    <div class="email-wrapper">
        <div class="email-container">
            <div class="email-header">
                <a href="https://padvault.io" style="text-decoration: none;">
                    <img src="https://padvault.io/logo-dark.svg" alt="Padvault" width="220" style="display: block; margin: 0 auto; outline: none; border: none; text-decoration: none;">
                </a>
            </div>
            
            <div class="email-body">
                {% block content %}{% endblock %}
            </div>
            
            <div class="email-footer">
                <div class="motto">Unlocking Real Estate Wealth</div>
                <p class="footer-text">&copy; {% now "Y" %} Padvault. Engineered for Stability.</p>
                <p class="footer-text" style="opacity: 0.5;">Secure Property Management & Custody</p>
                <p class="footer-text" style="font-size: 10px; margin-top: 20px;">This is an automated concierge message. Please do not reply directly.</p>
            </div>
        </div>
    </div>
</body>
</html>
